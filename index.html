<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Sistema de Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>🛒 Sistema de Inventario</h1>
                    <p class="subtitle">Controla tus compras, ventas y stock</p>
                </div>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Verificando...</span>
                </div>
            </div>
        </header>

        <div class="stats-panel" id="statsPanel">
            <div class="stat-card">
                <span class="stat-icon">📦</span>
                <div class="stat-info">
                    <h3 id="totalProductos">0</h3>
                    <p>Productos</p>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">💰</span>
                <div class="stat-info">
                    <h3 id="totalIngresos">S/. 0.00</h3>
                    <p>Ingresos totales</p>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">📊</span>
                <div class="stat-info">
                    <h3 id="totalVentas">0</h3>
                    <p>Ventas realizadas</p>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⚠️</span>
                <div class="stat-info">
                    <h3 id="stockBajo">0</h3>
                    <p>Stock bajo</p>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="abrirModal('compra')">📥 Nueva Compra</button>
            <button class="btn btn-success" onclick="abrirModal('venta')">💰 Registrar Venta</button>
            <button class="btn btn-warning" onclick="abrirModal('stock')">📦 Agregar Stock</button>
            <button class="btn btn-info" onclick="mostrarReporte()">📊 Ver Reporte</button>
        </div>

        <div class="inventory-container">
            <h2>📋 Inventario Actual</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." onkeyup="filtrarProductos()">
                <select id="filterStock" onchange="filtrarProductos()">
                    <option value="todos">Todos</option>
                    <option value="bajo">Stock bajo</option>
                    <option value="agotado">Agotados</option>
                    <option value="disponible">Disponibles</option>
                </select>
                <button class="btn-refresh" onclick="cargarProductos()">🔄 Actualizar</button>
            </div>
            <div id="productList" class="product-list">
                <div class="loading"><p>Cargando productos...</p></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="reporteModal" class="modal">
        <div class="modal-content modal-reporte">
            <span class="close" onclick="cerrarReporte()">&times;</span>
            <div id="reporteBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
